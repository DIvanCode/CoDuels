events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Docker DNS: адреса обновляются после пересоздания отдельных контейнеров.
  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 5s;

  upstream duely_backend {
    zone duely_backend 64k;
    server duely:5001 resolve;
  }

  upstream taski_backend {
    zone taski_backend 64k;
    server taski:5252 resolve;
  }

  upstream dashboard_backend {
    zone dashboard_backend 64k;
    server dashboard:9000 resolve;
  }

  upstream frontend_backend {
    zone frontend_backend 64k;
    server frontend:80 resolve;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # WebSocket Duely. Префикс /api удаляется перед передачей запроса.
    location ^~ /api/users/connect {
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass http://duely_backend;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # Публичные маршруты Duely.
    location ~ ^/api/(users|groups|tournaments|duels|code-runs|actions)(/|$) {
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass http://duely_backend;
    }

    # Публичные файлы и метаданные задач Taski.
    location ^~ /api/task {
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass http://taski_backend;
    }

    # Exesh dashboard доступен по адресу /dashboard/.
    location = /dashboard {
      return 308 /dashboard/;
    }

    location /dashboard/ {
      proxy_pass http://dashboard_backend/;
    }

    # Всё остальное обслуживает SPA Frontend.
    location / {
      proxy_pass http://frontend_backend;
    }
  }
}
