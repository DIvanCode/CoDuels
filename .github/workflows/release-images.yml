name: Release images

on:
  push:
    branches: [master]
    paths:
      - VERSION

permissions:
  contents: read

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out release revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version=$(< VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "VERSION must contain a semantic version such as 1.0.0" >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/v${version}^{commit}" >/dev/null; then
            echo "Release tag v${version} already exists; increment VERSION before merging" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

  build-frontend:
    name: Build Frontend image
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
      VITE_BASE_URL: ${{ vars.VITE_BASE_URL || '/api' }}
    steps:
      - name: Check out release revision
        uses: actions/checkout@v4

      - name: Check out Frontend
        run: git submodule update --init --depth 1 Frontend

      - name: Build and archive Frontend
        shell: bash
        run: |
          set -euo pipefail

          image="divancode74-coduels-frontend:${VERSION}"
          asset="$RUNNER_TEMP/release-assets/divancode74-coduels-frontend-${VERSION}.tar.gz"
          mkdir -p "$(dirname "$asset")"

          docker build \
            --build-arg "VITE_BASE_URL=${VITE_BASE_URL}" \
            --tag "$image" \
            Frontend
          docker save "$image" | gzip -1 > "$asset"

      - name: Upload Frontend image
        uses: actions/upload-artifact@v4
        with:
          name: release-image-frontend-${{ needs.version.outputs.value }}
          path: ${{ runner.temp }}/release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-duely:
    name: Build Duely images
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - name: Check out release revision
        uses: actions/checkout@v4

      - name: Check out Backend
        run: git submodule update --init --depth 1 Backend

      - name: Build and archive Duely
        shell: bash
        run: |
          set -euo pipefail

          runtime_image="divancode74-coduels-duely:${VERSION}"
          migration_image="divancode74-coduels-duely-migration:${VERSION}"
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"

          docker build --target runtime --tag "$runtime_image" Backend/Duely
          docker build --target migration --tag "$migration_image" Backend/Duely
          docker save "$runtime_image" | gzip -1 > "$asset_dir/divancode74-coduels-duely-${VERSION}.tar.gz"
          docker save "$migration_image" | gzip -1 > "$asset_dir/divancode74-coduels-duely-migration-${VERSION}.tar.gz"

      - name: Upload Duely images
        uses: actions/upload-artifact@v4
        with:
          name: release-image-duely-${{ needs.version.outputs.value }}
          path: ${{ runner.temp }}/release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-taski:
    name: Build Taski image
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - name: Check out release revision
        uses: actions/checkout@v4

      - name: Check out Backend
        run: git submodule update --init --depth 1 Backend

      - name: Build and archive Taski
        shell: bash
        run: |
          set -euo pipefail

          image="divancode74-coduels-taski:${VERSION}"
          asset="$RUNNER_TEMP/release-assets/divancode74-coduels-taski-${VERSION}.tar.gz"
          mkdir -p "$(dirname "$asset")"

          docker build --tag "$image" Backend/Taski
          docker save "$image" | gzip -1 > "$asset"

      - name: Upload Taski image
        uses: actions/upload-artifact@v4
        with:
          name: release-image-taski-${{ needs.version.outputs.value }}
          path: ${{ runner.temp }}/release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-exesh:
    name: Build Exesh images
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - name: Check out release revision
        uses: actions/checkout@v4

      - name: Check out Backend and Exesh build dependencies
        run: |
          git submodule update --init --depth 1 Backend
          git -C Backend submodule update --init --depth 1 Exesh/isolate Exesh/testlib

      - name: Build and archive Exesh
        shell: bash
        run: |
          set -euo pipefail

          coordinator_image="divancode74-coduels-exesh-coordinator:${VERSION}"
          worker_image="divancode74-coduels-exesh-worker:${VERSION}"
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"

          docker build \
            --tag "$coordinator_image" \
            --tag "$worker_image" \
            Backend/Exesh
          docker save "$coordinator_image" | gzip -1 > "$asset_dir/divancode74-coduels-exesh-coordinator-${VERSION}.tar.gz"
          docker save "$worker_image" | gzip -1 > "$asset_dir/divancode74-coduels-exesh-worker-${VERSION}.tar.gz"

      - name: Upload Exesh images
        uses: actions/upload-artifact@v4
        with:
          name: release-image-exesh-${{ needs.version.outputs.value }}
          path: ${{ runner.temp }}/release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-analyzer:
    name: Build Analyzer image
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - name: Check out release revision
        uses: actions/checkout@v4

      - name: Check out Backend
        run: git submodule update --init --depth 1 Backend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: Backend/Analyzer/requirements.txt

      - name: Train Analyzer models
        working-directory: Backend/Analyzer
        run: |
          python -m pip install -r requirements.txt
          python train.py --data-dir data/train

      - name: Build and archive Analyzer
        shell: bash
        run: |
          set -euo pipefail

          image="divancode74-coduels-analyzer:${VERSION}"
          asset="$RUNNER_TEMP/release-assets/divancode74-coduels-analyzer-${VERSION}.tar.gz"
          mkdir -p "$(dirname "$asset")"

          docker build --tag "$image" Backend/Analyzer
          docker save "$image" | gzip -1 > "$asset"

      - name: Upload Analyzer image
        uses: actions/upload-artifact@v4
        with:
          name: release-image-analyzer-${{ needs.version.outputs.value }}
          path: ${{ runner.temp }}/release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs:
      - version
      - build-frontend
      - build-duely
      - build-taski
      - build-exesh
      - build-analyzer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.value }}
    steps:
      - name: Download image archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-image-*-${{ needs.version.outputs.value }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP/release-assets"
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release create "v${VERSION}" ./*.tar.gz ./SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CoDuels ${VERSION}" \
            --generate-notes \
            --notes 'Each `.tar.gz` asset is a Docker image archive. Load one with `gzip -dc <asset>.tar.gz | docker load`.'
