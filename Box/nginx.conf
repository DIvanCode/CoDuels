events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location ^~ /api/users/connect {
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass http://duely:5001;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location ~ ^/api/(users|groups|tournaments|duels|code-runs|actions)(/|$) {
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass http://duely:5001;
    }

    location ^~ /api/task {
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass http://taski:5252;
    }

    location = /exesh-dashboard {
      return 308 /exesh-dashboard/;
    }

    location /exesh-dashboard/ {
      proxy_pass http://dashboard:9000/;
    }

    location / {
      proxy_pass http://frontend:80;
    }
  }
}
