<h1 class="title">A + B</h1>

<div class="legend">
    <p>Даны два целых числа $$$A$$$ и $$$B$$$. Нужно найти их сумму.</p>
</div>

<div class="input-specification">
    <div class="section-title">Входные данные</div>
    <p>
        Первая и единственная строка входных данных содержит два целых числа $$$A$$$ и $$$B$$$.
        Гарантируется, что $$$1 \leq A, B \leq 10^9$$$.
    </p>
</div>

<div class="output-specification">
    <div class="section-title">Выходные данные</div>
    <p>Вывести одно число - сумму $$$A$$$ и $$$B$$$.</p>
</div>
